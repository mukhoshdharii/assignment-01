<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heade</title>
    <link rel="stylesheet" href="styles/button.css">
    <link rel="stylesheet" href="styles/head.css">
    <link rel="stylesheet" href="styles/nav_bar.css">
    <link rel="stylesheet" href="styles/banner.css">
    <link rel="stylesheet" href="styles/speakers.css">
    <style>
        .container {
            display: flex;
        }
        .hbanner{
            color: azure;
            text-align: center;
            padding-top: 30px;
        }
        .hbannerp{
            color: azure;
            text-align: center;
            padding-left: 60px;
            width: 80%;
        }
        

            
        

        .logo {
            display: flex;
            justify-content: space-around;
            justify-content: left;
        }

        .nav {
            display: flex;
            justify-content: space-around;

            justify-content: center;
        }
        .button1{
            margin-left: 20px;
            display: flex;
            
            justify-content: end;
        }
        .button2{
            display: flex;
            justify-content: center;
            align-items: baseline;
        }
        

        
    </style>
</head>

<body>
    <header>

        <nav class="container">
            <div class="logo">
                <img src="resources/logo.png" alt="">
            </div>
            <ul class="nav">
                <li>Speakers</li>
                <li>Schedule</li>
                <li>Tracks</li>
                <li>Venue</li>
                <li>Blogs</li>
            </ul>
            <div class="button1">
                <button>Register Now</button>
            </div>
        </nav>
    </header>
    
    
    
    <main>
        <section class="hero">
            <h1 class="hbanner">
                Code.<em>Connect</em>.Create
            </h1>
            <p class="hbannerp">
                Join 4000+ engineers, founders and builders at the premier devoloper
                conference of 2026. Three days of cutting-edge talks, hands-on workshops, and meaningful connections.
                
            </p>
            <div class="button2">
                <button>Register Now</button>
            </div>

        </section>
        <section>
             <h1 style="text-align: center;">Meet the Speakers</h1>
        </section>
        <section class="speakers">
            <div class="space">
                <img class="sp" src="resources/andrej.png" alt="a picture of andrej karpathy"> 
                
            </div>
            <div class="space">
                <img class="sp" src="resources/demis.png" alt="a picture of demis hassabis">
            </div>
            <div class="space">
                <img class="sp" src="resources/gary.png" alt="a picture of grey marcues">
            </div>

            <div class="space">
                <img class="sp" src="resources/mustafa.png" alt="a picture of mustafa suleyman">
            </div>

                
        </section>
             
    </main>

</html>
