<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heade</title>
    <link rel="stylesheet" href="styles/head.css">
    <style>
        .container {


            display: flex;
            
        }
        nav ul li a{
            text-decoration: none;
        }
        

        nav ul li{
            cursor: pointer;
            margin-right: 5px;
            margin-left: 5px;
        }
        nav ul{
            display: flex;
            list-style: none;
        }
        nav ul li:hover{
            background-color: blanchedalmond;
        }

        .logo {
            display: flex;
            justify-content: space-around;
            justify-content: left;
        }

        .nav {
            display: flex;
            justify-content: space-around;

            justify-content: center;
        }
        .button{
            margin-left: 20px;
            display: flex;
            justify-content: space-around;
            justify-content: right;
        }

        button {
            justify-content: right;
            height: 30px;
            width: 120px;
            color: aliceblue;
            background-color: rgb(28, 63, 239);
            justify-content: right;
            cursor: pointer;

        }
    </style>
</head>

<body>
    <main>
        <nav class="container">
            <div class="logo">
                <img src="resources/logo.png" alt="">
            </div>
            <ul class="nav">
                <li>Speakers</li>
                <li>Schedule</li>
                <li>Tracks</li>
                <li>Venue</li>
                <li>Blogs</li>
            </ul>
            <div class="button">
                <button>Register Now</button>
            </div>
        </nav>



    </main>
</body>

</html>
